<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathtracing</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      #canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Issue #60: runtime scene/mode UI */
      #ui {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 100;
        max-height: calc(100% - 16px);
        overflow-y: auto;
        background: rgba(20, 20, 20, 0.85);
        color: #eee;
        font: 12px/1.4 sans-serif;
        padding: 10px 12px;
        border-radius: 6px;
        min-width: 220px;
      }
      #ui fieldset {
        border: 1px solid #555;
        margin: 0 0 8px;
        padding: 4px 8px;
      }
      #ui legend {
        padding: 0 4px;
      }
      #ui label {
        display: block;
        margin: 2px 0;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <!-- Issue #60: runtime scene/mode UI -->
    <div id="ui">
      <fieldset>
        <legend>Mode</legend>
        <label><input type="checkbox" id="toggle-pathtracing" checked /> Path tracing</label>
        <span id="frame-counter">0 frames</span>
      </fieldset>
      <fieldset>
        <legend>Light</legend>
        <label>X <input type="range" id="light-x" min="0" max="1" step="0.01" value="0.5" /></label>
        <label>Y <input type="range" id="light-y" min="0" max="1" step="0.01" value="0.96" /></label>
        <label>Z <input type="range" id="light-z" min="-1" max="1" step="0.01" value="0" /></label>
        <label>Intensity
          <input type="range" id="light-intensity" min="1" max="20" step="0.5" value="9" />
        </label>
      </fieldset>
    </div>
    <!-- <script src="https://greggman.github.io/webgl-lint/webgl-lint.js"></script> -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
